<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 569" width="1920" height="569" preserveAspectRatio="none" role="img" aria-label="บทความออนไลน์: สาระสุขภาพและการดูแลตัวเอง โรงพยาบาลโคกศรีสุพรรณ">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F5F1" />
      <stop offset="65%" stop-color="#EDEAE2" />
      <stop offset="100%" stop-color="#E2DDD2" />
    </linearGradient>
  </defs>

  <rect width="1920" height="569" fill="url(#bgGrad3)" />

  <!-- แถบตกแต่งฝั่งขวา -->
  <path d="M 1220 0 L 1920 0 L 1920 569 L 1080 569 Z" fill="#243B55" fill-opacity="0.06" />

  <!-- แถบคาดด้านล่าง -->
  <rect x="0" y="445" width="1920" height="124" fill="#FFFFFF" fill-opacity="0.94" />
  <rect x="0" y="440" width="760" height="6" fill="#D93829" />
  <rect x="760" y="440" width="1160" height="6" fill="#1F5A50" />

  <!-- ข้อความบทความออนไลน์ฝั่งซ้าย -->
  <g font-family="'Prompt', 'Sarabun', sans-serif">
    <rect x="150" y="54" width="240" height="40" rx="20" fill="#243B55" />
    <text x="270" y="80" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600">บทความสุขภาพออนไลน์</text>

    <text x="150" y="155" fill="#1F5A50" font-size="42" font-weight="600">รู้ทันสัญญาณเตือนโรคหัวใจและความดันโลหิต</text>
    <text x="150" y="235" fill="#243B55" font-size="60" font-weight="700">ดูแลตัวเองอย่างไรให้ห่างไกลภาวะฉุกเฉิน</text>
    <text x="150" y="298" fill="#475569" font-size="28" font-weight="400">อ่านบทความแนะนำการสังเกตอาการเบื้องต้น โภชนาการ และการออกกำลังกายที่เหมาะสม</text>

    <g transform="translate(150, 336)">
      <rect x="0" y="0" width="250" height="54" rx="12" fill="#1F5A50" />
      <text x="125" y="34" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="600">คลิกอ่านบทความฉบับเต็ม →</text>
    </g>

    <text x="150" y="492" fill="#243B55" font-size="28" font-weight="700">คลังความรู้สุขภาพ โรงพยาบาลโคกศรีสุพรรณ</text>
    <text x="150" y="528" fill="#475569" font-size="20" font-weight="500">อัปเดตข่าวสาร งานสิ่งพิมพ์ และบทความทางการแพทย์เพื่อประชาชน</text>
  </g>

  <!-- การ์ดตัวอย่างบทความฝั่งขวา -->
  <g transform="translate(1290, 75)" font-family="'Prompt', sans-serif">
    <rect x="0" y="0" width="480" height="315" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="32" y="32" width="110" height="30" rx="6" fill="#FDF2F1" />
    <text x="87" y="53" text-anchor="middle" fill="#D93829" font-size="16" font-weight="600">HEALTH TIPS</text>
    <text x="32" y="105" fill="#1E293B" font-size="26" font-weight="700">5 สัญญาณเตือนที่ไม่ควรมองข้าม</text>
    <text x="32" y="148" fill="#64748B" font-size="19" font-weight="400">• แน่นหน้าอก หายใจเหนื่อยง่ายผิดปกติ</text>
    <text x="32" y="182" fill="#64748B" font-size="19" font-weight="400">• เวียนศีรษะ หน้ามืด หรือใจสั่นบ่อยครั้ง</text>
    <text x="32" y="216" fill="#64748B" font-size="19" font-weight="400">• แขนขาอ่อนแรง หรือชาครึ่งซีกเฉียบพลัน</text>
    <text x="32" y="270" fill="#D93829" font-size="20" font-weight="600">สายด่วนฉุกเฉิน 24 ชม. โทร. 02 634 0990</text>
  </g>
</svg>
