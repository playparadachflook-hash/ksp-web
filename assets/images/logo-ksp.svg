<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 94" width="100" height="94" role="img" aria-label="ตราสัญลักษณ์ โรงพยาบาลโคกศรีสุพรรณ">
  <!-- =========================================================================
       ตราสัญลักษณ์ตัว K โรงพยาบาลโคกศรีสุพรรณ (Vector SVG คมชัด 100%)
       - ซีกซ้าย: ปีกสีเทาโค้งมน + เงาองค์พระธาตุเชิงชุมสีขาว/เทาเข้ม
       - ซีกขวาบน: ใบไม้สีเขียวหัวเป็ด (#1F5A50) + กากบาทการแพทย์สีขาว
       - ซีกขวาล่าง: ใบไม้สีเขียวหัวเป็ด (#1F5A50)
       ========================================================================= -->
  <defs>
    <clipPath id="leftWing">
      <path d="M 4 4 C 28 4, 46 22, 46 50 L 46 90 L 4 90 Z" />
    </clipPath>
  </defs>

  <!-- 1. ปีกซ้ายสีเทา + องค์พระธาตุเชิงชุม -->
  <g clip-path="url(#leftWing)">
    <!-- พื้นหลังปีกซ้ายสีเทาอ่อน -->
    <rect x="4" y="4" width="42" height="86" fill="#CCCCCC" />

    <!-- องค์พระธาตุฝั่งซ้าย (สีขาว) -->
    <path d="
      M 26 28
      L 24.5 48
      L 22 54
      L 22 58
      L 19 61
      L 19 66
      L 15 69
      L 15 74
      L 10 76
      L 10 81
      L 6 83
      L 6 90
      L 26 90
      Z" fill="#FFFFFF" />

    <!-- องค์พระธาตุฝั่งขวา (สีเทาเข้มสร้างมิติแสงเงา) -->
    <path d="
      M 26 28
      L 27.5 48
      L 30 54
      L 30 58
      L 33 61
      L 33 66
      L 37 69
      L 37 74
      L 42 76
      L 42 81
      L 45 83
      L 45 90
      L 26 90
      Z" fill="#999B9E" />

    <!-- ซุ้มประตูพระธาตุ 3 ช่องด้านล่าง -->
    <rect x="14" y="77" width="4.5" height="10" rx="0.8" fill="#CCCCCC" />
    <path d="M 23.5 87 L 23.5 72 L 26 67 L 28.5 72 L 28.5 87 Z" fill="#D9DADB" />
    <rect x="33.5" y="77" width="4.5" height="10" rx="0.8" fill="#CCCCCC" />
  </g>

  <!-- 2. ใบไม้ขวาบน (สีเขียวหัวเป็ด #1F5A50) + เครื่องหมายบวกสีขาว -->
  <path d="M 51 45 C 51 18, 69 4, 94 4 C 94 31, 78 45, 51 45 Z" fill="#1F5A50" />
  <!-- เครื่องหมายบวก (+) สีขาว -->
  <g fill="#FFFFFF">
    <rect x="69.5" y="15.5" width="6" height="18" rx="0.8" />
    <rect x="63.5" y="21.5" width="18" height="6" rx="0.8" />
  </g>

  <!-- 3. ใบไม้ขวาล่าง (สีเขียวหัวเป็ด #1F5A50) -->
  <path d="M 51 49 C 78 49, 94 63, 94 90 C 69 90, 51 76, 51 49 Z" fill="#1F5A50" />
</svg>
