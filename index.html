<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>โรงพยาบาลโคกศรีสุพรรณ | KHOKSRISUPHAN HOSPITAL</title>

  <!-- ดึงฟอนต์ภาษาไทย Prompt จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- เชื่อมต่อไฟล์ CSS แยกตามส่วนของใครของมันชัดเจน -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/slidebar.css" />
  <link rel="stylesheet" href="css/executive.css" />
  <link rel="stylesheet" href="css/departments.css" />
  <link rel="stylesheet" href="css/news-section.css" />
  <link rel="stylesheet" href="css/policy-section.css" />
  <link rel="stylesheet" href="css/downloads-section.css" />
  <link rel="stylesheet" href="css/intranet-section.css" />
  <link rel="stylesheet" href="css/contact-section.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <!-- ปุ่มสถานะและอัปเดตระบบจาก GitHub อัตโนมัติ (สีเขียว=ปัจจุบัน, สีเหลือง=รออัปเดต) -->
  <link rel="stylesheet" href="css/auto-update-widget.css" />
</head>
<body>

  <!-- =========================================================================
       ส่วนที่ 1: แถบเมนูด้านบน (Header Bar)
       แยกไฟล์อยู่ที่ css/header.css และ js/header.js
       ========================================================================= -->
  <div id="header-placeholder"></div>

  <!-- =========================================================================
       พื้นที่เนื้อหาหลักของหน้าเว็บ (#page-content)
       ทุกๆ ส่วน/เมนูที่วางใน <main id="page-content"> ทั้งปัจจุบันและที่เพิ่มใหม่ในอนาคต
       จะถูกจัดเรียงต่อกันลงมาอย่างสวยงาม ขอบซ้าย-ขวาตรงกัน และมีระยะห่างเท่ากันอัตโนมัติ
       ========================================================================= -->
  <main id="page-content">

    <!-- ส่วนที่ 2: แถบสไลด์ประกาศรูปภาพ งานสิ่งพิมพ์ และบทความออนไลน์ (Slide Bar) -->
    <div id="slidebar-placeholder"></div>

    <!-- ส่วนที่ 3: ผู้บริหารและวิสัยทัศน์โรงพยาบาล (วางต่อจาก Slide Bar ทันที) -->
    <div id="executive-placeholder"></div>

    <!-- ส่วนที่ 4: แผนกและคลินิก -->
    <div id="departments-placeholder"></div>

    <!-- ส่วนที่ 5: ข่าวสาร & กิจกรรม -->
    <div id="news-placeholder"></div>

    <!-- ส่วนที่ 6: ประกาศนโยบายโรงพยาบาล -->
    <div id="policy-placeholder"></div>

    <!-- ส่วนที่ 7: ดาวน์โหลดเอกสาร -->
    <div id="downloads-placeholder"></div>

    <!-- ส่วนที่ 8: เว็บไซต์ภายใน (ระบบสารสนเทศโรงพยาบาล) -->
    <div id="intranet-placeholder"></div>

    <!-- ส่วนที่ 9: ติดต่อเรา & แผนที่นำทาง Google Maps -->
    <div id="contact-placeholder"></div>

  </main>

  <!-- =========================================================================
       ส่วนที่ 10: แถบส่วนท้ายเว็บไซต์ (Footer Bar)
       ดึงมาจากไฟล์กลาง css/footer.css และ js/footer.js อัตโนมัติทุกหน้า
       ========================================================================= -->
  <div id="footer-placeholder"></div>

  <!-- เชื่อมต่อไฟล์ JavaScript แยกตามส่วนชัดเจน แก้ไขส่วนไหนเปิดไฟล์นั้นได้เลย -->
  <script src="js/data/cms-store.js"></script>
  <script src="js/header.js"></script>
  <script src="js/slidebar.js"></script>
  <script src="js/executive.js"></script>
  <script src="js/departments.js"></script>
  <script src="js/news-section.js"></script>
  <script src="js/policy-section.js"></script>
  <script src="js/downloads-section.js"></script>
  <script src="js/intranet-section.js"></script>
  <script src="js/contact-section.js"></script>
  <script src="js/footer.js"></script>
  <!-- ปุ่มสถานะและอัปเดตระบบจาก GitHub อัตโนมัติ (สีเขียว=ปัจจุบัน, สีเหลือง=รออัปเดต) -->
  <script src="js/auto-update-widget.js"></script>
</body>
</html>
